<style>
:root{
  --bg:#0b100d;--fg:#e6fff0;--dim:#9db8a8;--acc:#2effa8;

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:clamp(14px,1.05vw,22px)}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);min-height:100vh}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(46,255,168,.08),transparent 70%);
}
::selection{background:var(--acc);color:#032014}
a{color:inherit;text-decoration:none}

.top{
  position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;
  max-width:2000px;margin:0 auto;padding:.625rem clamp(.875rem,2vw,2rem);background:rgba(11,16,13,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.logo{font-size:1.125rem;color:var(--acc);font-weight:700;letter-spacing:.2em;text-shadow:0 0 10px rgba(46,255,168,.45)}
.logo .caret{animation:blink 1s steps(1) infinite}
#langSel{
  font-family:var(--mono);font-size:.8125rem;letter-spacing:.04em;color:var(--fg);
  background:var(--bg);border:1px solid var(--acc);padding:.375rem .5rem;cursor:pointer;outline:none;
}
#langSel:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(46,255,168,.2)}
#langSel option{color:var(--fg);background:#0b100d}

main{max-width:2000px;margin:0 auto;padding:1rem clamp(.875rem,2vw,2rem) 0}

.hero{display:flex;align-items:center;justify-content:space-between;gap:2rem;padding:.5rem 0 .125rem}
.hero-text{flex:1 1 auto;min-width:0}
#earth{flex:none;display:block;pointer-events:none}
.h-title{font-size:clamp(2rem,5.5vw,3.4rem);letter-spacing:.16em;color:var(--acc);text-shadow:0 0 18px rgba(46,255,168,.45)}
.h-sub{margin-top:.375rem;font-size:.9375rem;letter-spacing:.2em;color:var(--fg)}
.h-intro{margin-top:.625rem;font-size:.9375rem;line-height:1.85;color:var(--fg);opacity:.95}

.divider{
  color:var(--dim);font-size:.8125rem;letter-spacing:.2em;margin:1.25rem 0 .625rem;
  user-select:none;white-space:nowrap;overflow:hidden;
  display:flex;align-items:center;
}
.divider::after{content:"";flex:1;margin-left:.625rem;border-bottom:1px dashed var(--line)}

.svc{display:flex;gap:.875rem;padding:.6875rem 0;border-bottom:1px dashed rgba(46,255,168,.2)}
.svc:last-child{border-bottom:none}
.svc-idx{flex:none;width:3.625rem;font-size:1.625rem;font-weight:700;line-height:1.15;color:var(--acc);opacity:.5;letter-spacing:.08em;padding-top:.125rem;text-shadow:0 0 14px rgba(46,255,168,.3)}
.svc:hover .svc-idx{opacity:1;text-shadow:0 0 16px rgba(46,255,168,.6)}
.svc-title{font-size:1rem;color:var(--fg);letter-spacing:.06em}
.svc-desc{font-size:.875rem;color:#c5ddcf;margin-top:.25rem;line-height:1.7}

.contact-line{display:flex;gap:1.125rem;align-items:baseline;padding:.5rem 0;border-bottom:1px dashed rgba(46,255,168,.2)}
.contact-line .lab{flex:none;width:3.75rem;font-size:.8125rem;letter-spacing:.2em;color:var(--dim)}
.contact-line .val{font-size:1rem;color:var(--acc);letter-spacing:.05em;word-break:break-all}
.contact-line:hover .val{text-shadow:0 0 12px rgba(46,255,168,.55)}

footer{border-top:1px solid var(--line);margin-top:2.125rem;padding:1rem clamp(.875rem,2vw,2rem) 1.75rem;text-align:center;font-size:.8125rem;color:var(--dim);letter-spacing:.14em}
footer .hl{color:var(--acc)}

@keyframes blink{50%{opacity:0}}
@media(max-width:640px){.svc{gap:.75rem}.svc-idx{width:2.75rem;font-size:1.375rem}}
@media(max-width:900px){#earth{display:none}}
@media(min-width:880px){
  #svcList{display:grid;grid-template-columns:repeat(auto-fit,minmax(24rem,1fr));gap:0 2.5rem}
  .svc:last-child{border-bottom:1px dashed rgba(46,255,168,.2)}
}
</style>

        '<div class="svc-idx">' + ('0' + (i + 1)).slice(-2) + '</div>' +

    });
    svcList.innerHTML = html;
  }

  function applyLang(lang){
    var dict = I18N[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var parts = el.dataset.i18n.split('.');
      var node = dict;
      for (var i = 0; i < parts.length; i++) { node = node[parts[i]]; }
      if (typeof node === 'string') { el.textContent = node; }
    });
    renderSvc(dict);
    langSel.value = lang;
  }

  function getDefaultLang(){
    var saved = null;
    try { saved = localStorage.getItem('crteam-lang'); } catch(e) {}
    if (saved && I18N[saved]) { return saved; }
    return 'en';
  }

  var current = getDefaultLang();
  applyLang(current);

  langSel.addEventListener('change', function(){
    current = langSel.value;
    try { localStorage.setItem('crteam-lang', current); } catch(e) {}
    applyLang(current);
  });
})();

<script>
(function(){
  'use strict';
  var can = document.createElement('canvas');
  if (!can.getContext) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ctx = can.getContext('2d');
  var C = '46,255,168';
  can.id = 'bgfx';
  can.style.cssText = 'position:fixed;inset:0;z-index:-2;pointer-events:none';
  document.body.insertBefore(can, document.body.firstChild);

  var W = 0, H = 0, CELL = 80;
  var pads = [], traces = [], packets = [], particles = [], hexes = [];

  function rand(a, b){ return a + Math.random() * (b - a); }

  function build(){
    CELL = Math.max(70, Math.min(110, Math.round(Math.min(W, H) / 14)));
    pads = []; traces = []; packets = []; particles = []; hexes = [];

    var cols = Math.ceil(W / CELL) + 1, rows = Math.ceil(H / CELL) + 1, i, j, x, y;
    var grid = [];
    for (x = 0; x < cols; x++){
      grid[x] = [];
      for (y = 0; y < rows; y++){
        grid[x][y] = Math.random() < 0.32;
        if (grid[x][y]) pads.push({ x: x * CELL, y: y * CELL, ph: Math.random() * 6.283 });
      }
    }
    for (i = 0; i < pads.length; i++){
      var p = pads[i];
      var gx = Math.round(p.x / CELL), gy = Math.round(p.y / CELL);
      if (gx + 1 < cols && grid[gx + 1][gy] && Math.random() < 0.28){
        traces.push([{ x: p.x, y: p.y }, { x: p.x + CELL * 0.45, y: p.y }, { x: p.x + CELL, y: p.y }]);
      }
      if (gy + 1 < rows && grid[gx][gy + 1] && Math.random() < 0.28){
        traces.push([{ x: p.x, y: p.y }, { x: p.x, y: p.y + CELL * 0.45 }, { x: p.x, y: p.y + CELL }]);
      }
    }
    var n = Math.min(16, traces.length);
    for (i = 0; i < n; i++){
      var tr = traces[Math.floor(Math.random() * traces.length)];
      var len = 0;
      for (j = 1; j < tr.length; j++) len += Math.abs(tr[j].x - tr[j - 1].x) + Math.abs(tr[j].y - tr[j - 1].y);
      packets.push({ tr: tr, len: len, t: Math.random(), dir: Math.random() < 0.5 ? 1 : -1, sp: rand(25, 65) });
    }
    var pn = Math.round(W * H / 26000);
    for (i = 0; i < pn; i++){
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rand(0.5, 1.6), a: rand(0.08, 0.25), vy: -rand(5, 22), vx: rand(-3, 3),
        ph: Math.random() * 6.283, tw: rand(0.5, 2)
      });
    }
    for (i = 0; i < 6; i++){
      hexes.push({
        x: rand(W * 0.06, W * 0.94), y: rand(H * 0.06, H * 0.94),
        r: rand(90, 240), rot: Math.random() * 6.283, rs: rand(-0.008, 0.008)
      });
    }
  }

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    can.width = Math.round(W * dpr); can.height = Math.round(H * dpr);
    can.style.width = W + 'px'; can.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function ptOnPath(tr, t, out){
    var i, total = 0, d;
    var seg = [];
    for (i = 1; i < tr.length; i++) seg.push(Math.abs(tr[i].x - tr[i - 1].x) + Math.abs(tr[i].y - tr[i - 1].y));
    for (i = 0; i < seg.length; i++) total += seg[i];
    d = t * total;
    for (i = 0; i < seg.length; i++){
      if (d <= seg[i] || i === seg.length - 1){
        var f = seg[i] === 0 ? 0 : d / seg[i];
        out.x = tr[i].x + (tr[i + 1].x - tr[i].x) * f;
        out.y = tr[i].y + (tr[i + 1].y - tr[i].y) * f;
        return;
      }
      d -= seg[i];
    }
  }

  function drawGrid(){
    var x, y;
    ctx.strokeStyle = 'rgba(' + C + ',0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (x = 0; x <= W; x += CELL){ ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (y = 0; y <= H; y += CELL){ ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }

  function drawTraces(){
    var i, tr;
    ctx.strokeStyle = 'rgba(' + C + ',0.09)';
    ctx.lineWidth = 1;
    for (i = 0; i < traces.length; i++){
      tr = traces[i];
      ctx.beginPath();
      ctx.moveTo(tr[0].x, tr[0].y);
      ctx.lineTo(tr[1].x, tr[1].y);
      ctx.lineTo(tr[2].x, tr[2].y);
      ctx.stroke();
    }
  }

  function drawPads(t){
    var i;
    for (i = 0; i < pads.length; i++){
      var p = pads[i];
      var a = 0.1 + 0.08 * (0.5 + 0.5 * Math.sin(t * 1.2 + p.ph));
      ctx.fillStyle = 'rgba(' + C + ',' + a.toFixed(3) + ')';
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
  }

  function drawHexes(t){
    var i, j;
    ctx.strokeStyle = 'rgba(' + C + ',0.05)';
    ctx.lineWidth = 1;
    for (i = 0; i < hexes.length; i++){
      var h = hexes[i];
      var rot = h.rot + t * h.rs;
      ctx.beginPath();
      for (j = 0; j < 6; j++){
        var ang = rot + j * Math.PI / 3;
        var px = h.x + Math.cos(ang) * h.r, py = h.y + Math.sin(ang) * h.r;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }

  function drawPackets(dt){
    var i, out = { x: 0, y: 0 };
    for (i = 0; i < packets.length; i++){
      var pk = packets[i];
      pk.t += pk.dir * pk.sp * dt / pk.len;
      if (pk.t > 1){ pk.t = 1; pk.dir = -1; }
      if (pk.t < 0){ pk.t = 0; pk.dir = 1; }
      ptOnPath(pk.tr, pk.t, out);
      ctx.fillStyle = 'rgba(' + C + ',0.1)';
      ctx.beginPath(); ctx.arc(out.x, out.y, 4, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(' + C + ',0.85)';
      ctx.beginPath(); ctx.arc(out.x, out.y, 1.3, 0, 6.283); ctx.fill();
    }
  }

  function drawParticles(t, dt){
    var i;
    for (i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y < -4){ p.y = H + 4; p.x = Math.random() * W; }
      var tw = 0.5 + 0.5 * Math.sin(t * p.tw + p.ph);
      ctx.fillStyle = 'rgba(' + C + ',' + (p.a * tw).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
  }

  window.addEventListener('resize', resize);
  resize();

  if (reduce){
    drawGrid(); drawTraces(); drawPads(0); drawHexes(0);
    return;
  }

  var prev = 0;
  function frame(now){
    var dt = Math.min((now - prev) / 1000, 0.05) || 0.016;
    prev = now;
    var t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    drawHexes(t);
    drawTraces();
    drawPads(t);
    drawPackets(dt);
    drawParticles(t, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
  'use strict';
  var can = document.getElementById('earth');
  if (!can || !can.getContext) return;
  var ctx = can.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var C = '46,255,168';
  var R = 0, CX = 0, CY = 0, F = 0;
  var rings = [], parts = [];

  function build(){
    var s = Math.min(420, Math.max(240, Math.round(window.innerWidth * 0.26)));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    can.style.width = s + 'px'; can.style.height = s + 'px';
    can.width = Math.round(s * dpr); can.height = Math.round(s * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = s / 2; CY = s / 2;
    R = s * 0.36; F = R * 3;

    rings = [];
    var i, k, pts, th, phi;
    for (i = 1; i <= 7; i++){
      phi = -Math.PI / 2 + Math.PI * i / 8;
      pts = [];
      for (k = 0; k < 28; k++){
        th = 2 * Math.PI * k / 28;
        pts.push([R * Math.cos(phi) * Math.cos(th), R * Math.sin(phi), R * Math.cos(phi) * Math.sin(th)]);
      }
      rings.push(pts);
    }
    for (i = 0; i < 10; i++){
      th = 2 * Math.PI * i / 10;
      pts = [];
      for (k = 0; k <= 16; k++){
        phi = -Math.PI * 0.42 + Math.PI * 0.84 * k / 16;
        pts.push([R * Math.cos(phi) * Math.cos(th), R * Math.sin(phi), R * Math.cos(phi) * Math.sin(th)]);
      }
      rings.push(pts);
    }
    parts = [];
    var n = Math.round(s * s / 1400);
    for (i = 0; i < n; i++){
      var y = 1 - 2 * (i + 0.5) / n;
      var rr = Math.sqrt(Math.max(0, 1 - y * y));
      var tt = i * 2.399963;
      parts.push([R * Math.cos(tt) * rr, R * y, R * Math.sin(tt) * rr]);
    }
  }

  function frame(t){
    ctx.clearRect(0, 0, CX * 2, CY * 2);
    var a = t * 0.28, ca = Math.cos(a), sa = Math.sin(a);
    var tilt = -0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
    var i, k, x1, z1, y1, z2, d, sc, sx, sy, pts, p, nz;

    var g = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 1.4);
    g.addColorStop(0, 'rgba(' + C + ',0.07)');
    g.addColorStop(1, 'rgba(' + C + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, R * 1.4, 0, 6.283); ctx.fill();

    for (i = 0; i < rings.length; i++){
      pts = rings[i];
      ctx.beginPath();
      var started = false, avgZ = 0, cnt = 0;
      for (k = 0; k < pts.length; k++){
        p = pts[k];
        x1 = p[0] * ca + p[2] * sa;
        z1 = -p[0] * sa + p[2] * ca;
        y1 = p[1] * ct - z1 * st;
        z2 = p[1] * st + z1 * ct;
        d = F + z2;
        if (d < 0.1){ started = false; continue; }
        sc = F / d;
        sx = CX + x1 * sc; sy = CY + y1 * sc;
        avgZ += z2; cnt++;
        if (!started){ ctx.moveTo(sx, sy); started = true; }
        else ctx.lineTo(sx, sy);
      }
      if (cnt){
        ctx.strokeStyle = 'rgba(' + C + ',' + (0.05 + 0.16 * ((avgZ / cnt + R) / (2 * R))).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    for (i = 0; i < parts.length; i++){
      p = parts[i];
      x1 = p[0] * ca + p[2] * sa;
      z1 = -p[0] * sa + p[2] * ca;
      y1 = p[1] * ct - z1 * st;
      z2 = p[1] * st + z1 * ct;
      d = F + z2;
      if (d < 0.1) continue;
      sc = F / d;
      sx = CX + x1 * sc; sy = CY + y1 * sc;
      nz = (z2 + R) / (2 * R);
      ctx.fillStyle = 'rgba(' + C + ',' + (0.18 + 0.55 * nz).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, 0.8 + 1.5 * nz, 0, 6.283); ctx.fill();
    }
  }

  window.addEventListener('resize', build);
  build();

  if (reduce){ frame(0.6); return; }

  function loop(now){
    frame(now / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
